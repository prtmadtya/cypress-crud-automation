name: Cypress E2E Tests with Mochawesome Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cypress-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Buat folder laporan sebelum tes berjalan agar tidak error jika folder belum ada
      - name: Create Report Directories
        run: mkdir -p cypress/results cypress/reports

      # Jalankan tes menggunakan browser Electron bawaan Cypress
      - name: Run Cypress Tests
        run: npx cypress run --browser electron --reporter mochawesome --reporter-options reportDir=cypress/results,overwrite=false,html=false,json=true

      # Merge report Mochawesome
      - name: Generate Mochawesome Report
        if: always()
        run: |
          npx mochawesome-merge cypress/results/*.json > cypress/results/mochawesome.json
          npx marge cypress/results/mochawesome.json -o cypress/reports

      - name: Upload Mochawesome Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-mochawesome-report
          path: cypress/reports/
          retention-days: 7